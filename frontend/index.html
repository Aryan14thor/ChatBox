<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ephemeral — Live Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="join-screen" class="join-screen">
    <div class="join-bg">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
    <div class="join-card">
      <div class="join-header">
        <div class="brand-pill">⬡ ephemeral</div>
        <h1 class="join-title">Talk freely.<br/><em>Leave nothing behind.</em></h1>
        <p class="join-sub">No accounts. No logs. No history. Messages vanish when you go.</p>
      </div>
      <div class="join-fields">
        <div class="field">
          <label>Your name</label>
          <div class="input-wrap">
            <svg class="iico" width="16" height="16" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input id="input-username" type="text" placeholder="ghost_rider" maxlength="20" autocomplete="off" spellcheck="false"/>
          </div>
        </div>
        <div class="field">
          <label>Room</label>
          <div class="input-wrap">
            <svg class="iico" width="16" height="16" viewBox="0 0 20 20" fill="none">
              <path d="M3 5a2 2 0 012-2h10a2 2 0 012 2v7a2 2 0 01-2 2H7l-4 3V5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <input id="input-room" type="text" placeholder="general" maxlength="30" autocomplete="off" spellcheck="false"/>
          </div>
        </div>
        <button id="btn-join">
          Enter Room
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="join-note">Open multiple tabs to test real-time chat</p>
    </div>
  </div>

  <div id="app" class="app hidden">

    <aside class="sidebar">
      <div class="sb-brand">
        <span class="sb-dot"></span>
        <span class="sb-name">ephemeral</span>
        <span class="sb-live">LIVE</span>
      </div>
      <div class="sb-section">
        <div class="sb-label">Rooms</div>
        <ul id="rooms-list" class="sb-rooms"></ul>
      </div>
      <div class="sb-section sb-members-section">
        <div class="sb-label">Members</div>
        <ul id="users-list" class="sb-members"></ul>
      </div>
      <div class="sb-me">
        <div class="sb-me-avatar" id="me-avatar">?</div>
        <div class="sb-me-info">
          <span id="display-username" class="sb-me-name">—</span>
          <span class="sb-me-status">online</span>
        </div>
        <button id="btn-leave" class="sb-leave" title="Leave room">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
            <path d="M7 3H4a1 1 0 00-1 1v12a1 1 0 001 1h3M13 15l4-5-4-5M8 10h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-hdr">
        <div class="hdr-left">
          <span class="hdr-hash">#</span>
          <span id="display-room" class="hdr-room">—</span>
        </div>
        <div class="hdr-right">
          <span id="online-count" class="hdr-count"></span>
          <span id="typing-indicator" class="typing-pill hidden"></span>
        </div>
      </header>

      <div id="messages" class="msgs-scroll">
        <div id="messages-inner" class="msgs-list"></div>
      </div>

      <footer class="chat-foot">
        <div class="composer">
          <input
            id="msg-input"
            type="text"
            placeholder="Message the room…"
            maxlength="500"
            autocomplete="off"
          />
          <button id="btn-send" title="Send">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M17 10L3 3l3.5 7L3 17l14-7z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="composer-foot">
          <span id="char-count" class="char-counter">0 / 500</span>
        </div>
      </footer>
    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/state.js"></script>
  <script src="js/socketClient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
